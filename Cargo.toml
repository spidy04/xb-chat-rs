# xb-chat in Rust: a workspace of small crates that match how it runs.
#
#   proto    the wire: codec, framing, Noise transport, the server link, upload tokens
#   core     chat logic and data: sessions, store, redb + fjall, replica pairs, relay
#   server   xb-server: core + its web port (phones connect here directly)
#   gateway  xb-gateway: holds phones' connections for a core
#   media    xb-media: encrypted files only
#   loadgen  the load test tool
#   tunnel   xb-tunnel: reach a server behind NAT through a public relay (like ngrok)
[workspace]
resolver = "3"
members = ["proto", "core", "server", "gateway", "media", "loadgen", "tunnel"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
xb-proto = { path = "proto" }
xb-core = { path = "core" }
xb-media = { path = "media" }
aes-gcm = "0.10"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
fjall = "2.11.2"
flate2 = "1.1.10"
futures-util = "0.3.34"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
rand = "0.8"
redb = "2.6.4"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
rsa = { version = "0.9", features = ["sha2"] }
scrypt = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver-crypto", "risky-raw-split"] }
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

# Crypto (scrypt, AES, X25519) is very slow unoptimized: optimize dependencies
# even in debug builds.
[profile.dev.package."*"]
opt-level = 3
